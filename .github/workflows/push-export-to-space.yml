name: Push export branch to fake Space

on:
  pull_request:
    branches:
      - master-jetforcer

jobs:
  push-to-fake-space:
    if: github.event.pull_request.head.ref != ''
    runs-on: ubuntu-latest

    environment:
      name: fake-space

    permissions:
      contents: write

    env:
      SPACE_REMOTE_NAME: space
      SPACE_REPO_URL: git@github.com:BulgakovAnton/sandbox-fake.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch export branch
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.head_ref }}"
          EXPORT_BRANCH="export/${SOURCE_BRANCH}"
          git fetch origin "${EXPORT_BRANCH}:${EXPORT_BRANCH}"
          git checkout "${EXPORT_BRANCH}"

      - name: Configure git identity
        run: |
          git config user.name "Writerside Export Bot"
          git config user.email "writerside-export-bot@jetbrains.space"

      - name: Configure SSH
        env:
          SPACE_SSH_PRIVATE_KEY: ${{ secrets.SPACE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SPACE_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Add fake Space remote
        run: |
          set -euo pipefail
          git remote remove "${SPACE_REMOTE_NAME}" || true
          git remote add "${SPACE_REMOTE_NAME}" "${SPACE_REPO_URL}"

      - name: Verify export branch is clean
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only HEAD | grep '^.github/'; then
            echo "ERROR: .github exists in export branch"
            exit 1
          fi

      - name: Push export branch to fake Space
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.head_ref }}"
          git push --force "${SPACE_REMOTE_NAME}" "HEAD:${SOURCE_BRANCH}"